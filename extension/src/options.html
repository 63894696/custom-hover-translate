<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Prisir 翻译 — 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>翻译 — 设置</h1>
  <p class="lead">所有设置保存在本机(<code>chrome.storage.local</code>),不上传、不收集翻译内容。绝大多数用户无需改动本页。</p>

  <fieldset>
    <legend>翻译引擎</legend>
    <label class="radio"><input type="radio" name="engine" value="auto" /> <strong>自动(推荐)</strong> — 能连 Google 用内置免 Key 翻译,否则用下方自定义端点</label>
    <label class="radio"><input type="radio" name="engine" value="google_gtx" /> 内置翻译(Google,免 Key)— 需能访问 Google</label>
    <label class="radio"><input type="radio" name="engine" value="openai_compat" /> 自定义端点(OpenAI 兼容)— 自己选模型厂商,填端点 + Key</label>
    <label class="radio"><input type="radio" name="engine" value="local_backend" /> 本地后端(进阶)— 本机 Ollama / 缓存 / 批量节流</label>
    <p class="hint">我们不预设任何国内或海外厂商。选「自定义端点」即可接入任何 OpenAI 兼容的翻译服务。<a href="https://prisir.example.com/translate-models" target="_blank" rel="noopener">不知道选哪个?看模型翻译能力评测 →</a></p>
  </fieldset>

  <fieldset id="custom-fieldset">
    <legend>自定义端点(选「自定义端点」时填)</legend>
    <label>API Base URL
      <input type="text" id="baseURL" placeholder="https://api.example.com/v1" />
    </label>
    <label>模型名(Model)
      <span class="model-row">
        <input type="text" id="model" list="model-list" placeholder="填好 URL+Key 后点右侧拉取,免手输" />
        <datalist id="model-list"></datalist>
        <button id="fetch-models" type="button" class="mini">拉取模型列表</button>
      </span>
    </label>
    <label>API Key(仅存本机)
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
    </label>
    <p class="hint" id="fetch-models-hint">任何 OpenAI 兼容(Chat Completions)的服务都可接入。Key 只保存在本机。</p>
  </fieldset>

  <fieldset id="backend-fieldset">
    <legend>本地后端(选「本地后端」时填)</legend>
    <label>后端地址
      <input type="text" id="endpoint" placeholder="http://127.0.0.1:12308" />
    </label>
    <p class="hint">需自行启动后端进程。适合本地模型(Ollama)或需要服务端缓存/节流的进阶场景。</p>
  </fieldset>

  <fieldset>
    <legend>翻译行为</legend>
    <label>目标语言
      <select id="dstLang">
        <option value="zh">中文(zh)</option>
        <option value="en">英文(en)</option>
        <option value="ja">日文(ja)</option>
        <option value="ko">韩文(ko)</option>
        <option value="fr">法文(fr)</option>
        <option value="de">德文(de)</option>
      </select>
    </label>
    <label>段落最小字符数(小于则不翻译)
      <input type="number" id="minChars" min="4" max="200" value="12" />
    </label>
    <label>段落最大字符数(超过则截断)
      <input type="number" id="maxChars" min="200" max="8000" value="1500" />
    </label>
    <label>缓存 TTL 小时
      <input type="number" id="ttlHours" min="1" max="720" value="24" />
    </label>
    <label class="check">
      <input type="checkbox" id="showOriginal" />
      译文上方同时显示原文小字(默认关)
    </label>
  </fieldset>

  <div class="actions">
    <button id="save" class="primary">保存</button>
    <button id="reset">恢复默认</button>
    <span id="msg" class="hint"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
