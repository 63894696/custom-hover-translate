<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Custom Hover Translate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Custom Hover Translate</h1>
    <p class="sub">OpenAI 兼容后端 · 多 provider 热切</p>
  </header>

  <!-- 大按钮:核心功能,沉浸式翻译插件的主打 -->
  <section class="hero">
    <button id="translate-all" class="hero-btn">整页双语对照</button>
    <button id="replace-all" class="hero-btn alt">整页仅译文</button>
    <button id="toggle-mode" class="hero-secondary toggle">↔ 切换(双语 ↔ 仅译文)</button>
    <button id="remove-all" class="hero-secondary">移除所有译文</button>
    <div id="hero-status" class="hero-status">点上方任一按钮 = 整页翻译 + 全局自动跟踪(FAQ/SPA 跟进)。点「切换」一键互换模式。</div>
  </section>

  <section class="status">
    <div class="led" id="led" title="后端健康状态"></div>
    <div class="status-text">
      <div id="status-line">检查中…</div>
      <div id="status-meta" class="muted"></div>
    </div>
  </section>

  <!-- Fallback 链:主用档用尽时自动切下一档;手动按钮跳过当前 -->
  <section class="fallback">
    <div class="fb-head">
      <span class="fb-title">Fallback 链</span>
      <label class="switch">
        <input type="checkbox" id="fb-enabled" />
        <span class="slider"></span>
      </label>
    </div>
    <div id="fb-chain" class="fb-chain"></div>
    <div class="fb-buttons">
      <button id="fb-prev" class="fb-btn">◀ 上一档</button>
      <button id="fb-next" class="fb-btn primary">下一档 ▶</button>
    </div>
    <div id="fb-last" class="muted fb-last"></div>
  </section>

  <section class="row">
    <label for="provider">Provider</label>
    <select id="provider"></select>
  </section>

  <section class="row">
    <label for="model">Model(留空用 provider 默认)</label>
    <input type="text" id="model" placeholder="例如 qwen3.7-max-2026-06-08" />
  </section>

  <section class="row buttons">
    <button id="apply">应用 Provider / Model</button>
  </section>

  <section class="row buttons small">
    <button id="copy-cmd">复制启动命令</button>
    <button id="open-options">打开设置</button>
    <button id="clear-cache">清缓存</button>
  </section>

  <section class="external-tool">
    <button id="open-pdf-translator" class="external-btn">
      <span class="ext-icon">📄</span>
      <span class="ext-text">
        <span class="ext-title">翻译 PDF / 文档</span>
        <span class="ext-sub">在新标签打开 pdftranslator.org · 免费 1000 页/月 · 无需注册</span>
      </span>
    </button>
  </section>

  <footer>
    <span id="last-info" class="muted"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
